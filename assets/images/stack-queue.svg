  <text x="100" y="130" fill="#6AE5FF" font-size="18" font-family="IBM Plex Sans, sans-serif">LIFO</text>
  <text x="610" y="130" fill="#8D6BFF" font-size="18" font-family="IBM Plex Sans, sans-serif">FIFO</text>
  <g transform="translate(96 180)">
    <rect x="0" y="180" width="160" height="56" rx="18" fill="#11234A" stroke="#6AE5FF" stroke-opacity=".35"/><rect x="0" y="116" width="160" height="56" rx="18" fill="#11234A" stroke="#6AE5FF" stroke-opacity=".35"/><rect x="0" y="52" width="160" height="56" rx="18" fill="#11234A" stroke="#6AE5FF" stroke-opacity=".35"/>
    <text x="80" y="215" text-anchor="middle" fill="#F5F7FF" font-size="24" font-family="Space Grotesk, sans-serif">pop</text>
    <text x="80" y="151" text-anchor="middle" fill="#F5F7FF" font-size="24" font-family="Space Grotesk, sans-serif">middle</text>
    <text x="80" y="87" text-anchor="middle" fill="#F5F7FF" font-size="24" font-family="Space Grotesk, sans-serif">top</text>
  </g>
  <g transform="translate(470 220)">
