<svg width="900" height="540" viewBox="0 0 900 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="540" rx="36" fill="#081224"/>
  <text x="60" y="72" fill="#F5F7FF" font-size="32" font-family="Space Grotesk, sans-serif">Recursion Flow</text>
  <g transform="translate(110 150)">
    <rect width="230" height="72" rx="22" fill="#11234A" stroke="#6AE5FF" stroke-opacity=".35"/><text x="116" y="46" text-anchor="middle" fill="#F5F7FF" font-size="24" font-family="Space Grotesk, sans-serif">solve(4)</text>
    <rect x="110" y="110" width="230" height="72" rx="22" fill="#11234A" stroke="#6AE5FF" stroke-opacity=".35"/><text x="226" y="156" text-anchor="middle" fill="#F5F7FF" font-size="24" font-family="Space Grotesk, sans-serif">solve(3)</text>
    <rect x="220" y="220" width="230" height="72" rx="22" fill="#11234A" stroke="#8D6BFF" stroke-opacity=".4"/><text x="336" y="266" text-anchor="middle" fill="#F5F7FF" font-size="24" font-family="Space Grotesk, sans-serif">solve(2)</text>
    <rect x="330" y="330" width="230" height="72" rx="22" fill="#11234A" stroke="#8D6BFF" stroke-opacity=".4"/><text x="446" y="376" text-anchor="middle" fill="#F5F7FF" font-size="24" font-family="Space Grotesk, sans-serif">base case</text>
    <path d="M116 72L226 110L336 220L446 330" stroke="url(#rec-line)" stroke-width="4" stroke-linecap="round"/>
  </g>
  <defs><linearGradient id="rec-line" x1="226" y1="222" x2="446" y2="442" gradientUnits="userSpaceOnUse"><stop stop-color="#6AE5FF"/><stop offset="1" stop-color="#8D6BFF"/></linearGradient></defs>
  <text x="60" y="474" fill="#A7B7D9" font-size="16" font-family="IBM Plex Sans, sans-serif">Base case stops the calls. Backtracking happens while the stack unwinds.</text>
</svg>
